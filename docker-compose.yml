# Phase 0/1 topology: one host, Docker Compose.  `docker compose up --build` starts everything:
#   postgres, redis -> migrate (goose) -> seed-dev (empty dev tenant) -> api, worker, scheduler -> web
# Open http://localhost:3000  (dev login, no Auth0 needed; see README for real Auth0).
# Dev credentials only. Caddy runs on the host in production (shared with other projects).
name: greenops

x-backend: &backend
  restart: unless-stopped
  depends_on:
    migrate: {condition: service_completed_successfully}
    redis: {condition: service_started}
    minio-init: {condition: service_completed_successfully}
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment: &env
    ENV: ${ENV:-dev}
    REDIS_ADDR: redis:6379
    AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
    AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
    AUTH_CLAIM_NS: ${AUTH_CLAIM_NS:-https://reliabilix.com/}
    ELECTRICITYMAPS_API_KEY: ${ELECTRICITYMAPS_API_KEY:-}
    PLATFORM_AWS_ACCOUNT_ID: ${PLATFORM_AWS_ACCOUNT_ID:-}   # shown to customers in the role trust policy
    SENTRY_DSN: ${SENTRY_DSN:-}
    RELEASE: ${BUILD_VERSION:-dev}
    S3_ENDPOINT: http://minio:9000
    S3_BUCKET: greenops
    S3_PATH_STYLE: "true"
    S3_ACCESS_KEY: dev
    S3_SECRET_KEY: dev-only-secret
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  postgres:
    image: postgres:18
    environment: {POSTGRES_DB: greenops, POSTGRES_USER: greenops_owner, POSTGRES_PASSWORD: dev-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql, "./deploy/docker/initdb:/docker-entrypoint-initdb.d:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U greenops_owner -d greenops"], interval: 3s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]

  migrate:
    build: {context: ., dockerfile: deploy/docker/Dockerfile, target: migrate}
    environment: {GOOSE_DBSTRING: "postgres://greenops_owner:dev-only@postgres:5432/greenops?sslmode=disable"}
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"
  seed-dev:   # DEV ONLY: creates an empty tenant so the UI works without Auth0
    image: postgres:18
    entrypoint: ["psql", "postgresql://greenops_owner:dev-only@postgres:5432/greenops", "-v", "ON_ERROR_STOP=1", "-f", "/seed.sql"]
    volumes: ["./deploy/dev/seed.sql:/seed.sql:ro"]
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: "no"

  greenops-api:
    <<: *backend
    build: {context: ., dockerfile: deploy/docker/Dockerfile, args: {CMD: api}}
    environment:
      <<: *env
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
      DATABASE_URL: postgres://greenops_api:dev-only@postgres:5432/greenops?sslmode=disable
    ports: ["127.0.0.1:8080:8080"]
  greenops-worker:
    <<: *backend
    build: {context: ., dockerfile: deploy/docker/Dockerfile, args: {CMD: worker}}
    environment:
      <<: *env
      METRICS_ADDR: ":9090"
      DATABASE_URL: postgres://greenops_worker:dev-only@postgres:5432/greenops?sslmode=disable
  greenops-scheduler:
    <<: *backend
    build: {context: ., dockerfile: deploy/docker/Dockerfile, args: {CMD: scheduler}}
    environment: {<<: *env}

  web:
    build: {context: ., dockerfile: deploy/docker/Dockerfile.web, args: {NEXT_PUBLIC_BUILD_VERSION: "${BUILD_VERSION:-dev}"}}
    restart: unless-stopped
    depends_on:
      greenops-api: {condition: service_started}
      seed-dev: {condition: service_completed_successfully}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp", "/app/.next/cache"]
    environment:
      API_URL: http://greenops-api:8080
      # Real Auth0 (leave empty for the dev login):
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
      AUTH0_SECRET: ${AUTH0_SECRET:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      AUTH_CLAIM_NS: ${AUTH_CLAIM_NS:-https://reliabilix.com/}
      # Dev login (only honoured together with APP_ENV=dev; the API independently requires ENV=dev for dev tokens)
      APP_ENV: ${ENV:-dev}
      DEV_AUTH: ${DEV_AUTH:-true}
      DEV_TENANT_ID: 00000000-0000-4000-8000-000000000001
      DEV_ROLE: ${DEV_ROLE:-owner}
    ports: ["127.0.0.1:3000:3000"]

  minio:   # S3-compatible object storage: reports, raw billing archive
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: dev, MINIO_ROOT_PASSWORD: dev-only-secret}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
    healthcheck: {test: ["CMD", "mc", "ready", "local"], interval: 3s, timeout: 3s, retries: 20}
  minio-init:
    image: minio/mc
    depends_on: {minio: {condition: service_healthy}}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 dev dev-only-secret && mc mb --ignore-existing local/greenops"]
    restart: "no"

  # Observability (profile: observability): docker compose --profile observability up
  prometheus:
    image: prom/prometheus
    profiles: [observability]
    volumes: ["./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["127.0.0.1:9091:9090"]
  tempo:
    image: grafana/tempo
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./deploy/observability/tempo/tempo.yaml:/etc/tempo.yaml:ro"]
  loki:
    image: grafana/loki
    profiles: [observability]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["./deploy/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro"]
  promtail:
    image: grafana/promtail
    profiles: [observability]
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes: ["./deploy/observability/promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro", "/var/run/docker.sock:/var/run/docker.sock:ro"]
    depends_on: [loki]
  grafana:
    image: grafana/grafana
    profiles: [observability]
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "false", GF_SECURITY_ADMIN_PASSWORD: dev-only}
    volumes: ["./deploy/observability/grafana:/etc/grafana/provisioning:ro", "./deploy/observability/dashboards:/var/lib/grafana/dashboards:ro"]
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus, tempo, loki]

volumes: {pgdata: {}, miniodata: {}}
