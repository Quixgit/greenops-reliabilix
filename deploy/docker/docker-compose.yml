# Local infrastructure only. Dev credentials, bound to localhost.
name: greenops
services:
  postgres:
    image: postgres:18
    environment: {POSTGRES_DB: greenops, POSTGRES_USER: greenops_owner, POSTGRES_PASSWORD: dev-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data"]
    ports: ["127.0.0.1:4222:4222"]
    volumes: [natsdata:/data]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: dev, MINIO_ROOT_PASSWORD: dev-only-secret}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
volumes: {pgdata: {}, natsdata: {}, miniodata: {}}
