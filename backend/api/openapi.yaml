      description: Operator console, admin operators only. Answers 200 with `ok` and a short, safe message.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/operator/settings:
    get:
      operationId: getOperatorSettings
      summary: Platform-level values of every setting
      tags:
      - operator
      description: |
        Platform operators only. For organization-scope settings the platform value is the default every organization inherits.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateOperatorSettings
      summary: Change platform-level values
      tags:
      - operator
      description: |
        Platform operators with the `admin` role only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/operator/settings/reset:
    post:
      operationId: resetOperatorSettings
      summary: Return platform-level values to the catalog defaults
      tags:
      - operator
      description: |
        Platform operators with the `admin` role only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsReset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/operator/settings/history:
    get:
      operationId: getOperatorSettingsHistory
      summary: Setting changes at platform level or for one organization
      tags:
      - operator
      description: Platform operators only. Without `tenant_id` the platform-level changes are returned.
      parameters:
      - name: tenant_id
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SettingChange'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/operator/tenants/{tenant_id}/settings:
    get:
      operationId: getOperatorTenantSettings
      summary: Effective settings of one organization
      tags:
      - operator
      description: |
        Platform operators only.
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateOperatorTenantSettings
      summary: Fix settings for one organization
      tags:
      - operator
      description: |
        Platform operators with the `admin` role only. Values set here override the organization's own and lock the setting for it; changes are recorded in the organization's audit log.
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/operator/tenants/{tenant_id}/settings/reset:
    post:
      operationId: resetOperatorTenantSettings
      summary: Remove operator overrides of one organization
      tags:
      - operator
      description: |
        Platform operators with the `admin` role only. The setting is unlocked and inherits again.
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsReset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsView'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Auth0 access token (RS256) or an API key (`grk_...`). Optional header `X-Tenant-ID` selects among several memberships.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    from:
      name: from
      in: query
      schema:
        type: string
        format: date
      description: 'Inclusive start (default: 30 days ago)'
    to:
      name: to
      in: query
      schema:
        type: string
        format: date
      description: 'Inclusive end (default: today)'
    project_id:
      name: project_id
      in: query
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        request_id:
          type: string
        errors:
          type: object
          description: For validation failures, one message per rejected field (for example per setting key)
          additionalProperties:
            type: string
      required:
      - title
      - status
      additionalProperties: true
    Queued:
      type: object
      properties:
        status:
          type: string
          enum:
          - queued
      additionalProperties: true
    TenantRef:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
      required:
      - tenant_id
      additionalProperties: true
    OnboardingInput:
      type: object
      properties:
        organization_name:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - organization_name
      additionalProperties: true
    AcceptInvitationInput:
      type: object
      properties:
        token:
          type: string
      required:
      - token
      additionalProperties: true
    Me:
      type: object
      properties:
        user_id:
          type: string
        tenant_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - owner
          - admin
          - engineer
          - viewer
          - billing
          - ci
      additionalProperties: true
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plan:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: true
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
          - owner
          - admin
          - engineer
          - viewer
          - billing
          - ci
        created_at:
          type: string
          format: date-time
      additionalProperties: true
    RoleInput:
      type: object
      description: Either a built-in `role` or a `custom_role_id` (exactly one). A built-in role withdraws any custom role.
      properties:
        role:
          type: string
          enum:
          - owner
          - admin
          - engineer
          - viewer
          - billing
        custom_role_id:
          type: string
          format: uuid
    CustomRole:
      type: object
      required: [id, name, description, permissions, members, created_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        permissions: {type: array, items: {type: string}}
        members: {type: integer}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CustomRoleInput:
      type: object
      required: [name, permissions]
      properties:
        name: {type: string, minLength: 2, maxLength: 60}
        description: {type: string, maxLength: 200}
        permissions: {type: array, items: {type: string}}
      additionalProperties: true
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
          - owner
          - admin
          - engineer
          - viewer
          - billing
          - ci
        created_by:
          type: string
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      additionalProperties: true
    InvitationInput:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - admin
          - engineer
          - viewer
          - billing
      required:
      - email
      - role
      additionalProperties: true
    InvitationCreated:
      type: object
      properties:
        invitation:
          $ref: '#/components/schemas/Invitation'
        token:
          type: string
          description: One-time token; shown once.
      additionalProperties: true
    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        role:
          type: string
          enum:
          - owner
          - admin
          - engineer
          - viewer
          - billing
          - ci
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: true
    ApiKeyInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum:
          - ci
          - viewer
          - agent
      required:
      - name
      - role
      additionalProperties: true
    ApiKeyCreated:
      type: object
      properties:
        api_key:
          $ref: '#/components/schemas/ApiKey'
        key:
          type: string
          description: The key; shown once, only its hash is stored.
      additionalProperties: true
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
        actor_user_id:
          type: string
        action:
          type: string
        target:
          type: string
        request_id:
          type: string
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
      additionalProperties: true
    Team:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        created_at: {type: string, format: date-time}
      additionalProperties: true
    Environment:
      type: object
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [production, staging, development, test, other]}
        connection_ids:
          type: array
          items: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
      additionalProperties: true
    AllocationTarget:
      type: object
      required: [project_id, weight]
      properties:
        project_id: {type: string, format: uuid}
        weight: {type: number, exclusiveMinimum: 0, description: Relative weight, not a percentage.}
    AllocationRuleInput:
      type: object
      required: [name, source_project_id, targets]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        source_project_id: {type: string, format: uuid}
        service_name: {type: string, maxLength: 200, description: Empty = every service of the source that has no rule of its own.}
        targets:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/AllocationTarget'
    AllocationRule:
      allOf:
      - $ref: '#/components/schemas/AllocationRuleInput'
      - type: object
        properties:
          id: {type: string, format: uuid}
          created_at: {type: string, format: date-time}
    AllocationReport:
      type: object
      properties:
        currency: {type: string}
        from: {type: string, format: date}
        to: {type: string, format: date}
        projects:
          type: array
          items:
            type: object
            properties:
              project_id: {type: string, format: uuid}
              direct: {type: number}
              allocated_in: {type: number}
              allocated_out: {type: number}
              total: {type: number}
        environments:
          type: array
          items:
            type: object
            properties:
              project_id: {type: string, format: uuid}
              environment_id: {type: string, format: uuid, nullable: true, description: null = connections of the project not assigned to an environment}
              cost: {type: number}
        teams:
          type: array
          items:
            type: object
            properties:
              team_id: {type: string, format: uuid, nullable: true, description: null = projects without a team}
              total: {type: number}
        excluded: {type: integer, description: Amounts left out for lack of a reference rate.}
      additionalProperties: true
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        functional_unit:
          type: string
        team_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
      additionalProperties: true
    ProjectInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        functional_unit:
          type: string
          minLength: 1
          maxLength: 60
      required:
      - name
      - functional_unit
      additionalProperties: true
    FunctionalUnits:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        units:
          type: number
      additionalProperties: true
    FunctionalUnitsInput:
      type: object
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        units:
          type: number
          minimum: 0
          exclusiveMinimum: true
      required:
      - period_start
      - period_end
      - units
      additionalProperties: true
    Policy:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        allowed_regions:
          type: array
          items:
            type: string
          maxItems: 50
          description: 'Data-residency allow-list. Empty = residency unknown: no region_shift is proposed.'
        ci_carbon_warn_kg:
          type: number
          nullable: true
        ci_carbon_block_kg:
          type: number
          nullable: true
        ci_cost_warn:
          type: number
          nullable: true
        ci_cost_block:
          type: number
          nullable: true
        alert_carbon_monthly_kg:
          type: number
          nullable: true
          description: Monthly carbon limit of the project in kg CO2e; a carbon alert opens when it is approached. Null = none.
        auto_apply_types:
          type: array
          items:
            type: string
            enum: [time_shift]
          description: Recommendation types applied without approval. Region moves and production changes always need approval.
      additionalProperties: true
    AutomationJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        recommendation_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - ec2_resize
          - ec2_terminate
          - region_shift
        status:
          type: string
          enum:
          - planned
          - approved
          - completed
          - failed
          - rolled_back
          - cancelled
        plan:
          type: object
          properties:
            summary:
              type: string
            steps:
              type: array
              items:
                type: string
            terraform:
              type: string
            cli:
              type: array
              items:
                type: string
        risk:
          type: object
          properties:
            level:
              type: string
              enum:
              - low
              - medium
              - high
            factors:
              type: array
              items:
                type: string
        rollback_plan:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        approved_by:
          type: string
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        finished_by:
          type: string
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        result_note:
          type: string
          nullable: true
    ExportConfig:
      type: object
      required:
      - bucket
      - name
      - region
      properties:
        bucket:
          type: string
          pattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
        prefix:
          type: string
          description: Key prefix without leading or trailing slash; may be empty.
        name:
          type: string
          pattern: ^[A-Za-z0-9_.-]{1,128}$
        region:
          type: string
          description: Region of the bucket.
    Connection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        provider:
          type: string
          enum:
          - aws
          - azure
          - gcp
        account_ref:
          type: string
        credential_ref:
          type: string
        access:
          type: string
          enum: [role, access_key, dataset_share, service_account_key, export, service_principal]
          description: How the platform authenticates to the customer's cloud (computed).
        external_id:
          type: string
        sync_status:
          type: string
          enum:
          - pending
          - healthy
          - error
        last_error:
          type: string
          nullable: true
        last_sync_at:
          type: string
          format: date-time
          nullable: true
        synced_through:
          type: string
          format: date-time
          nullable: true
        export:
          type: object
          nullable: true
          description: FOCUS data export the connection reads instead of Cost Explorer (null = Cost Explorer).
          allOf:
          - $ref: '#/components/schemas/ExportConfig'
      additionalProperties: true
    ConnectionInput:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        provider:
          type: string
          enum:
          - aws
          - gcp
          - azure
          description: GCP is available when the platform has a Google identity configured, Azure when it has its Microsoft Entra application configured.
        account_ref:
          type: string
          description: AWS account id (12 digits), GCP project id (6-30 lowercase letters, digits, hyphens) or Azure subscription id (GUID).
        credential_ref:
          type: string
          description: |
            A reference, never a credential. AWS: the IAM role ARN (role name starts with `Reliabilix`), or
            `awskey://<access key id>` of the customer's own read-only IAM user (with `client_secret`).
            GCP: `bq://<project>/<dataset>/<table>` of the Cloud Billing export table (`gcp_billing_export_v1_*` or
            `gcp_billing_export_resource_v1_*`). Azure: `azblob://<tenant id>@<storage account>/<container>/<export directory>`
            of the Cost Management FOCUS export, or `azcost://<tenant id>@<application (client) id>` for the customer's own
            service principal (role Cost Management Reader), which also needs `client_secret`. Raw keys, SAS tokens and
            URLs are rejected.
        client_secret:
          type: string
          writeOnly: true
          description: |
            Azure service principal: the client secret value. AWS `awskey://`: the secret access key. GCP: optionally the
            JSON key file of a service account (then queries run with it, in its project). It is sealed on arrival (AES-256-GCM, bound to the
            organization and the connection), never returned by any endpoint and never part of the data export.
      required:
      - project_id
      - provider
      - account_ref
      - credential_ref
      additionalProperties: true
    Setup:
      type: object
      properties:
        external_id:
          type: string
          description: Ownership token. AWS - the role's ExternalId. GCP - the key of the label the customer adds to the billing dataset. Azure - the container metadata key (hyphens become underscores) the customer sets to 1.
        platform_account_id:
          type: string
          description: AWS account, GCP service account or Azure application (client) id the customer grants access to.
        trust_policy:
          type: object
        permissions_policy:
          type: object
        required_permissions:
          type: array
          items:
            type: string
        steps:
          type: array
          description: Ordered, human-readable setup instructions (for GCP the BigQuery API, billing export, ownership label and dataset access; for Azure the export, container metadata, service principal and role).
          items:
            type: string
      additionalProperties: true
    ConnectResponse:
      type: object
      properties:
        connection:
          $ref: '#/components/schemas/Connection'
        setup:
          $ref: '#/components/schemas/Setup'
      additionalProperties: true
    SyncRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
          - running
          - succeeded
          - failed
        records:
          type: integer
        error:
          type: string
          nullable: true
      additionalProperties: true
    UsageRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        provider:
          type: string
        source:
          type: string
        resource_id:
          type: string
        resource_type:
          type: string
        service_name:
          type: string
        service_category:
          type: string
          enum:
          - compute
          - storage
          - database
          - networking
          - other
        region_id:
          type: string
        consumed_quantity:
          type: number
          nullable: true
        consumed_unit:
          type: string
          nullable: true
        billed_cost:
          type: number
        effective_cost:
          type: number
        currency:
          type: string
        charge_period_start:
          type: string
          format: date-time
        charge_period_end:
          type: string
          format: date-time
      additionalProperties: true
    CarbonTotals:
      type: object
      properties:
        intensity_origins:
          type: array
          description: Where the grid intensities behind the carbon came from. Empty source and basis = calculated before the origin was recorded.
          items:
            type: object
            required: [source, basis, carbon_kg_co2e, share_pct]
            properties:
              source: {type: string}
              basis: {type: string}
