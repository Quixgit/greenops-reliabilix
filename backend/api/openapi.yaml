# Kept in sync with the registered routes by internal/app TestOpenAPIMatchesRoutes.
openapi: 3.0.3
info:
  title: Reliabilix GreenOps API
  version: 1.0.0
  description: Multi-tenant FinOps + GreenOps API. Tenancy comes from the verified identity (membership in the database) or from an API key, never
    from request input. Every tenant table is protected by Row Level Security.
servers:
- url: https://api.reliabilix.green
security:
- bearerAuth: []
tags:
- name: system
  description: Health endpoints
- name: tenants
  description: Onboarding, members, invitations, API keys, audit log
- name: users
  description: Current identity
- name: projects
  description: Projects, SCI functional units and policies
- name: cloud
  description: Cloud connections and sync
- name: usage
  description: FOCUS usage records
- name: carbon
  description: Carbon calculation, summary, SCI and methodology
- name: ci
  description: CI gate for pipelines
- name: finops
  description: Cost summary, budgets, anomalies
- name: dashboard
  description: Read models of the Overview screen
- name: recommendations
  description: Recommendations and the human-approval workflow
- name: reports
  description: Report generation and download
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness
      tags:
      - system
      responses:
        '200':
          description: alive
      security: []
  /readyz:
    get:
      operationId: readyz
      summary: Readiness (database reachable)
      tags:
      - system
      responses:
        '200':
          description: ready
        '503':
          $ref: '#/components/responses/Problem'
      security: []
  /api/v1/onboarding:
    post:
      operationId: onboard
      summary: Create the caller's organization (idempotent)
      tags:
      - tenants
      description: Requires permission `valid identity (no tenant needed)`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantRef'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation (verified email must match)
      tags:
      - tenants
      description: Requires permission `valid identity (no tenant needed)`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationInput'
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantRef'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/me:
    get:
      operationId: getMe
      summary: Current identity
      tags:
      - users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/tenant:
    get:
      operationId: getTenant
      summary: Current organization
      tags:
      - tenants
      description: Requires permission `project:read`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/members:
    get:
      operationId: listMembers
      summary: List members
      tags:
      - tenants
      description: Requires permission `tenant:admin`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/members/{id}:
    patch:
      operationId: changeMemberRole
      summary: Change a member's role (last owner is protected)
      tags:
      - tenants
      description: Requires permission `tenant:admin`.
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeMember
      summary: Remove a member
      tags:
      - tenants
      description: Requires permission `tenant:admin`.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/invitations:
    get:
      operationId: listInvitations
      summary: List invitations
      tags:
      - tenants
      description: Requires permission `tenant:admin`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createInvitation
      summary: Invite a person (the one-time token is returned once)
      tags:
      - tenants
      description: Requires permission `tenant:admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreated'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys (never returns key material)
      tags:
      - tenants
      description: Requires permission `tenant:admin`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createApiKey
      summary: Create an API key (shown once)
      tags:
      - tenants
      description: Requires permission `tenant:admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key
      tags:
      - tenants
      description: Requires permission `tenant:admin`.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/audit-log:
    get:
      operationId: listAuditLog
      summary: Audit trail (append-only)
      tags:
      - tenants
      description: Requires permission `audit:read`.
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: action
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects
      tags:
      - projects
      description: Requires permission `project:read`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createProject
      summary: Create a project
      tags:
      - projects
      description: Requires permission `project:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/projects/{id}:
    get:
      operationId: getProject
      summary: Get a project
      tags:
      - projects
      description: Requires permission `project:read`.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/projects/{id}/functional-units:
    get:
      operationId: listFunctionalUnits
      summary: Reported functional units (SCI denominator R)
      tags:
      - projects
      description: Requires permission `project:read`.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FunctionalUnits'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      operationId: reportFunctionalUnits
      summary: Report functional units served in a period
      tags:
      - projects
      description: Requires permission `project:write`.
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunctionalUnitsInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionalUnits'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/projects/{id}/policy:
    get:
      operationId: getPolicy
      summary: Data-residency allow-list and CI thresholds
      tags:
      - projects
      description: Requires permission `project:read`.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      operationId: putPolicy
      summary: Replace the policy
      tags:
      - projects
      description: Requires permission `project:write`.
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/cloud-accounts:
    get:
      operationId: listCloudAccounts
      summary: List connections
      tags:
      - cloud
      description: Requires permission `cloud:read`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: connectCloudAccount
      summary: Register a pending connection; returns the ExternalId and role setup (no cloud call yet)
      tags:
      - cloud
      description: Requires permission `cloud:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/cloud-accounts/{id}:
    get:
      operationId: getCloudAccount
      summary: Get a connection with its setup instructions
      tags:
      - cloud
      description: Requires permission `cloud:read`.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteCloudAccount
      summary: Delete a connection
      tags:
      - cloud
      description: Requires permission `cloud:write`.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/cloud-accounts/{id}/verify:
    post:
      operationId: verifyCloudAccount
      summary: Verify the granted access; on success the connection becomes healthy and a first sync is queued
      tags:
      - cloud
      description: Requires permission `cloud:write`.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/cloud-accounts/{id}/sync:
    post:
      operationId: syncCloudAccount
      summary: Queue a sync now (deduplicated)
      tags:
      - cloud
      description: Requires permission `cloud:write`.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queued'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/cloud-accounts/{id}/sync-runs:
    get:
      operationId: listSyncRuns
      summary: Recent sync runs
      tags:
      - cloud
      description: Requires permission `cloud:read`.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncRun'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/usage:
    get:
      operationId: listUsage
      summary: FOCUS usage records
      tags:
      - usage
      description: Requires permission `usage:read`.
      parameters:
      - $ref: '#/components/parameters/from'
      - $ref: '#/components/parameters/to'
      - $ref: '#/components/parameters/project_id'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsageRecord'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/carbon/summary:
    get:
      operationId: getCarbonSummary
      summary: Totals, SCI and the preceding period
      tags:
      - carbon
      description: Requires permission `carbon:read`.
      parameters:
      - $ref: '#/components/parameters/from'
      - $ref: '#/components/parameters/to'
      - $ref: '#/components/parameters/project_id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarbonSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/carbon/trend:
    get:
      operationId: getCarbonTrend
      summary: Daily CO2e
      tags:
      - carbon
      description: Requires permission `carbon:read`.
      parameters:
      - $ref: '#/components/parameters/from'
      - $ref: '#/components/parameters/to'
      - $ref: '#/components/parameters/project_id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CarbonTrendPoint'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/carbon/methodology:
    get:
      operationId: getMethodology
      summary: The active coefficient set (transparency)
      tags:
      - carbon
      description: Requires permission `carbon:read`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Methodology'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/carbon/calculate:
    post:
      operationId: calculateCarbon
      summary: Energy and CO2e of one measurement in a region
      tags:
      - carbon
      description: Requires permission `carbon:compute`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateResult'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/carbon/recalculate:
    post:
      operationId: recalculateCarbon
      summary: Queue a recalculation (e.g. after reporting functional units)
      tags:
      - carbon
      description: Requires permission `carbon:compute`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecalculateInput'
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queued'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/ci/evaluate:
    post:
      operationId: evaluateCiGate
      summary: 'CI gate: PASS/WARN/BLOCK for a planned change (API key role `ci` or any member who may evaluate)'
      tags:
      - ci
      description: Requires permission `ci:evaluate`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
  /api/v1/finops/summary:
    get:
      operationId: getFinopsSummary
      summary: Spend by service and the preceding period
      tags:
      - finops
      description: Requires permission `usage:read`.
      parameters:
      - $ref: '#/components/parameters/from'
      - $ref: '#/components/parameters/to'
      - $ref: '#/components/parameters/project_id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinopsSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/finops/budgets:
    get:
      operationId: listBudgets
      summary: Budgets with current-period consumption
      tags:
      - finops
      description: Requires permission `billing:read`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BudgetStatus'
