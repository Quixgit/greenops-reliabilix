      - format
      - period_start
      - period_end
      additionalProperties: true
    NotificationCatalog:
      type: object
      required:
      - channels
      - event_types
      - configured
      - stubbed
      properties:
        channels:
          type: array
          description: Channels available on this deployment
          items:
            type: string
            example: webhook
        configured:
          type: boolean
        stubbed:
          type: array
          description: Channels running on a development stand-in (for example e-mail that is only logged)
          items:
            type: string
        event_types:
          type: array
          items:
            type: object
            required:
            - type
            - description
            - default_severity
            properties:
              type:
                type: string
                example: report.ready
              description:
                type: string
              default_severity:
                type: string
                enum:
                - info
                - warning
                - critical
    NotificationDestination:
      type: object
      required:
      - id
      - kind
      - name
      - target_hint
      - event_types
      - min_severity
      - enabled
      - created_by
      - created_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          example: slack
        name:
          type: string
        target_hint:
          type: string
          description: Masked mailbox or just the host of a URL; the address itself is never returned
        event_types:
          type: array
          items:
            type: string
          description: Event types (or "*") the destination receives
        min_severity:
          type: string
          enum:
          - info
          - warning
          - critical
        enabled:
          type: boolean
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    CreateNotificationDestination:
      type: object
      required:
      - kind
      - name
      - target
      properties:
        kind:
          type: string
          example: webhook
        name:
          type: string
          minLength: 1
          maxLength: 100
        target:
          type: string
          description: Mailbox (email) or URL (webhook, slack)
        event_types:
          type: array
          items:
            type: string
          description: Defaults to ["*"]
        min_severity:
          type: string
          enum:
          - info
          - warning
          - critical
          default: info
      additionalProperties: false
    CreatedNotificationDestination:
      type: object
      required:
      - destination
      properties:
        destination:
          $ref: '#/components/schemas/NotificationDestination'
        signing_secret:
          type: string
          description: Webhook signing secret. Returned on creation only.
    NotificationDelivery:
      type: object
      required:
      - id
      - destination_id
      - kind
      - destination_name
      - event_type
      - severity
      - status
      - attempts
      - next_attempt_at
      - last_error
      - created_at
      - sent_at
      properties:
        id:
          type: string
          format: uuid
        destination_id:
          type: string
          format: uuid
          nullable: true
          description: null once the destination was removed
        kind:
          type: string
        destination_name:
          type: string
        event_type:
          type: string
        severity:
          type: string
          enum:
          - info
          - warning
          - critical
        status:
          type: string
          enum:
          - pending
          - sent
          - failed
          - skipped
        attempts:
          type: integer
        next_attempt_at:
          type: string
          format: date-time
        last_error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
          nullable: true
    Operator:
      type: object
      required: [subject, email, role]
      properties:
        subject: {type: string}
        email: {type: string}
        role: {type: string, enum: [viewer, admin]}
    OperatorTenant:
      type: object
      required: [id, name, plan, created_at, members, projects, connections, connections_in_error, destinations, failed_deliveries_7d]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        plan: {type: string}
        created_at: {type: string, format: date-time}
        members: {type: integer}
        projects: {type: integer}
        connections: {type: integer}
        connections_in_error: {type: integer}
        destinations: {type: integer}
        failed_deliveries_7d: {type: integer}
    OperatorDelivery:
      type: object
      required: [tenant_id, tenant_name, id, destination_id, kind, destination_name, event_type, severity, status, attempts, next_attempt_at, last_error, created_at, sent_at]
      properties:
        tenant_id: {type: string, format: uuid}
        tenant_name: {type: string}
        id: {type: string, format: uuid}
        destination_id: {type: string, format: uuid, nullable: true}
        kind: {type: string}
        destination_name: {type: string}
        event_type: {type: string}
        severity: {type: string, enum: [info, warning, critical]}
        status: {type: string, enum: [pending, sent, failed, skipped]}
        attempts: {type: integer}
        next_attempt_at: {type: string, format: date-time}
        last_error: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        sent_at: {type: string, format: date-time, nullable: true}
    OperatorDeliveryStat:
      type: object
      required: [kind, status, count]
      properties:
        kind: {type: string}
        status: {type: string}
        count: {type: integer}
    OperatorConnection:
      type: object
      required: [tenant_id, tenant_name, provider, account_ref, sync_status, last_error, last_sync_at]
      properties:
        tenant_id: {type: string, format: uuid}
        tenant_name: {type: string}
        provider: {type: string}
        account_ref: {type: string}
        sync_status: {type: string}
        last_error: {type: string, nullable: true}
        last_sync_at: {type: string, format: date-time, nullable: true}
    OperatorAuditEntry:
      type: object
      required: [id, at, operator_sub, operator_email, role, action]
      properties:
        id: {type: integer, format: int64}
        at: {type: string, format: date-time}
        operator_sub: {type: string}
        operator_email: {type: string}
        role: {type: string}
        action: {type: string}
    OperatorDataSource:
      type: object
      required: [id, name, category, access, state, metrics, coverage, terms, note, integration_id, connections, organizations, in_error, last_sync_at]
      properties:
        id: {type: string}
        name: {type: string}
        category: {type: string, enum: [grid_intensity, billing, usage, kubernetes, methodology, inventory]}
        access: {type: string, enum: [free, paid, customer_provided, internal]}
        state: {type: string, enum: [ready, attention, not_configured, planned]}
        metrics: {type: array, items: {type: string}}
        coverage: {type: string}
        terms: {type: string}
        note: {type: string}
        integration_id: {type: string}
        connections: {type: integer, nullable: true}
        organizations: {type: integer, nullable: true}
        in_error: {type: integer, nullable: true}
        last_sync_at: {type: string, format: date-time, nullable: true}
    OperatorRecord:
      type: object
      required: [subject, email, role, created_at, last_seen_at, actions_30d]
      properties:
        subject: {type: string}
        email: {type: string}
        role: {type: string, enum: [viewer, admin]}
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time, nullable: true}
        actions_30d: {type: integer}
    OperatorJobs:
      type: object
      required: [queues, failed, schedules]
      properties:
        queues:
          type: array
          items:
            type: object
            required: [name, size, pending, active, scheduled, retry, archived, completed, processed_today, failed_today, latency_seconds, paused]
            properties:
              name: {type: string}
              size: {type: integer}
              pending: {type: integer}
              active: {type: integer}
              scheduled: {type: integer}
              retry: {type: integer}
              archived: {type: integer}
              completed: {type: integer}
              processed_today: {type: integer}
              failed_today: {type: integer}
              latency_seconds: {type: number}
              paused: {type: boolean}
        failed:
          type: array
          items:
            type: object
            required: [id, queue, type, state, last_error, retried, max_retry, last_failed_at, next_attempt_at]
            properties:
              id: {type: string}
              queue: {type: string}
              type: {type: string}
              state: {type: string}
              last_error: {type: string}
              retried: {type: integer}
              max_retry: {type: integer}
              last_failed_at: {type: string, format: date-time, nullable: true}
              next_attempt_at: {type: string, format: date-time, nullable: true}
        schedules:
          type: array
          items:
            type: object
            required: [spec, type, next, prev]
            properties:
              spec: {type: string}
              type: {type: string}
              next: {type: string, format: date-time}
              prev: {type: string, format: date-time, nullable: true}
    OperatorPlan:
      type: object
      required: [id, name, description, limits, modules, organizations]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        limits: {type: object, additionalProperties: {type: integer}}
        modules: {type: object, additionalProperties: {type: boolean}}
        organizations: {type: integer}
    OperatorSystem:
      type: object
      required: [version, env, expected_migration, integrations]
      properties:
        version: {type: string}
        env: {type: string}
        expected_migration: {type: integer}
        integrations:
          type: array
          items:
            type: object
            required: [name, status, note]
            properties:
              name: {type: string}
              status: {type: string, enum: [ready, stub, missing]}
              note: {type: string}
    OperatorError:
      type: object
      required: [id, service, component, severity, message, status, occurrences, first_seen, last_seen, tenant_id, tenant_name, last_request_id, handled_by, handled_at]
      properties:
        id: {type: string, format: uuid}
        service: {type: string, example: worker}
        component: {type: string, example: "cloudaccounts:sync_aws_account"}
        severity: {type: string, enum: [warning, error, critical]}
        message: {type: string}
        status: {type: string, enum: [open, resolved, ignored]}
        occurrences: {type: integer}
        first_seen: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}
        tenant_id: {type: string, format: uuid, nullable: true}
        tenant_name: {type: string, nullable: true}
        last_request_id: {type: string, nullable: true}
        handled_by: {type: string, nullable: true}
        handled_at: {type: string, format: date-time, nullable: true}
    SettingItem:
      type: object
      required: [key, group, title, description, scope, type, default, value, source, locked, editable]
      properties:
        key: {type: string, example: security.invitation_expiry_days}
        group: {type: string}
        title: {type: string}
        description: {type: string}
        note: {type: string}
        scope: {type: string, enum: [platform, tenant, operator]}
        type: {type: string, enum: [bool, int, float, string, enum, list]}
        default: {}
        value: {}
        source: {type: string, enum: [default, platform, tenant, operator]}
        locked: {type: boolean}
        editable: {type: boolean}
        unit: {type: string}
        min: {type: number}
        max: {type: number}
        enum: {type: array, items: {type: string}}
        list_enum: {type: array, items: {type: string}}
        max_items: {type: integer}
        min_items: {type: integer}
        max_len: {type: integer}
        pattern: {type: string}
        updated_by: {type: string, nullable: true}
        updated_at: {type: string, format: date-time, nullable: true}
    SettingsView:
      type: object
      required: [groups, items]
      properties:
        groups:
          type: array
          items:
            type: object
            required: [id, title, description]
            properties:
              id: {type: string}
              title: {type: string}
              description: {type: string}
        items:
          type: array
          items:
            $ref: '#/components/schemas/SettingItem'
    SettingsPatch:
      type: object
      required: [values]
      properties:
        values:
          type: object
          description: Map of setting key to its new JSON value
          additionalProperties: true
      additionalProperties: false
    SettingsReset:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: {type: string}
      additionalProperties: false
    SettingChange:
      type: object
      required: [at, tenant_id, key, old_value, new_value, actor, via]
      properties:
        at: {type: string, format: date-time}
        tenant_id: {type: string, format: uuid, nullable: true}
        key: {type: string}
        old_value: {description: "Previous JSON value; null when there was none"}
        new_value: {description: "New JSON value; null when the value was removed"}
        actor: {type: string}
        via: {type: string, enum: [tenant, operator]}
