components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Auth0 access token (RS256) or an API key (`grk_...`). Optional header `X-Tenant-ID` selects among several memberships.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    from:
      name: from
      in: query
      schema:
        type: string
        format: date
      description: 'Inclusive start (default: 30 days ago)'
    to:
      name: to
      in: query
      schema:
        type: string
        format: date
      description: 'Inclusive end (default: today)'
    project_id:
      name: project_id
      in: query
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        request_id:
          type: string
      required:
      - title
      - status
      additionalProperties: true
    Queued:
      type: object
      properties:
        status:
          type: string
          enum:
          - queued
      additionalProperties: true
    TenantRef:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
      required:
      - tenant_id
      additionalProperties: true
    OnboardingInput:
      type: object
      properties:
        organization_name:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - organization_name
      additionalProperties: true
    AcceptInvitationInput:
      type: object
      properties:
        token:
          type: string
      required:
      - token
      additionalProperties: true
    Me:
      type: object
      properties:
        user_id:
          type: string
        tenant_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - owner
          - admin
          - engineer
          - viewer
          - billing
          - ci
      additionalProperties: true
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plan:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: true
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
          - owner
          - admin
          - engineer
          - viewer
          - billing
          - ci
        created_at:
          type: string
          format: date-time
      additionalProperties: true
    RoleInput:
      type: object
      properties:
        role:
          type: string
          enum:
          - owner
          - admin
          - engineer
          - viewer
          - billing
      required:
      - role
      additionalProperties: true
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
          - owner
          - admin
          - engineer
          - viewer
          - billing
          - ci
        created_by:
          type: string
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      additionalProperties: true
    InvitationInput:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - admin
          - engineer
          - viewer
          - billing
      required:
      - email
      - role
      additionalProperties: true
    InvitationCreated:
      type: object
      properties:
        invitation:
          $ref: '#/components/schemas/Invitation'
        token:
          type: string
          description: One-time token; shown once.
      additionalProperties: true
    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        role:
          type: string
          enum:
          - owner
          - admin
          - engineer
          - viewer
          - billing
          - ci
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: true
    ApiKeyInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum:
          - ci
          - viewer
      required:
      - name
      - role
      additionalProperties: true
    ApiKeyCreated:
      type: object
      properties:
        api_key:
          $ref: '#/components/schemas/ApiKey'
        key:
          type: string
          description: The key; shown once, only its hash is stored.
      additionalProperties: true
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
        actor_user_id:
          type: string
        action:
          type: string
        target:
          type: string
        request_id:
          type: string
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
      additionalProperties: true
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        functional_unit:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: true
    ProjectInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        functional_unit:
          type: string
          minLength: 1
          maxLength: 60
      required:
      - name
      - functional_unit
      additionalProperties: true
    FunctionalUnits:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        units:
          type: number
      additionalProperties: true
    FunctionalUnitsInput:
      type: object
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        units:
          type: number
          minimum: 0
          exclusiveMinimum: true
      required:
      - period_start
      - period_end
      - units
      additionalProperties: true
    Policy:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        allowed_regions:
          type: array
          items:
            type: string
          maxItems: 50
          description: 'Data-residency allow-list. Empty = residency unknown: no region_shift is proposed.'
        ci_carbon_warn_kg:
          type: number
          nullable: true
        ci_carbon_block_kg:
          type: number
          nullable: true
        ci_cost_warn:
          type: number
          nullable: true
        ci_cost_block:
          type: number
          nullable: true
      additionalProperties: true
    Connection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        provider:
          type: string
          enum:
          - aws
          - azure
          - gcp
        account_ref:
          type: string
        credential_ref:
          type: string
        external_id:
          type: string
        sync_status:
          type: string
          enum:
          - pending
          - healthy
          - error
        last_error:
          type: string
          nullable: true
        last_sync_at:
          type: string
          format: date-time
          nullable: true
        synced_through:
          type: string
          format: date-time
          nullable: true
      additionalProperties: true
    ConnectionInput:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        provider:
          type: string
          enum:
          - aws
          description: Azure and GCP arrive in phase 2.
        account_ref:
          type: string
          pattern: ^\d{12}$
        credential_ref:
          type: string
          description: IAM role ARN. Raw access keys are rejected.
      required:
      - project_id
      - provider
      - account_ref
      - credential_ref
      additionalProperties: true
    Setup:
      type: object
      properties:
        external_id:
          type: string
        platform_account_id:
          type: string
        trust_policy:
          type: object
        permissions_policy:
          type: object
        required_permissions:
          type: array
          items:
            type: string
      additionalProperties: true
    ConnectResponse:
      type: object
      properties:
        connection:
          $ref: '#/components/schemas/Connection'
        setup:
          $ref: '#/components/schemas/Setup'
      additionalProperties: true
    SyncRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
          - running
          - succeeded
          - failed
        records:
          type: integer
        error:
          type: string
          nullable: true
      additionalProperties: true
    UsageRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        provider:
          type: string
        source:
          type: string
        resource_id:
          type: string
        resource_type:
          type: string
        service_name:
          type: string
        service_category:
          type: string
          enum:
          - compute
          - storage
          - database
          - networking
          - other
        region_id:
          type: string
        consumed_quantity:
          type: number
          nullable: true
        consumed_unit:
          type: string
          nullable: true
        billed_cost:
          type: number
        effective_cost:
          type: number
        currency:
          type: string
        charge_period_start:
          type: string
          format: date-time
        charge_period_end:
          type: string
          format: date-time
      additionalProperties: true
    CarbonTotals:
      type: object
      properties:
        energy_kwh:
          type: number
        carbon_kg_co2e:
          type: number
        sci_score:
          type: number
          nullable: true
        carbon_intensity_g_per_kwh:
          type: number
      additionalProperties: true
    CarbonSummary:
      type: object
      properties:
        energy_kwh:
          type: number
        carbon_kg_co2e:
          type: number
        sci_score:
          type: number
          nullable: true
        carbon_intensity_g_per_kwh:
          type: number
        has_data:
          type: boolean
        previous:
          $ref: '#/components/schemas/CarbonTotals'
        methodology_version:
          type: string
        comparable:
          type: boolean
          description: False when the current or previous window has data for fewer than 80% of its days; clients must not show a delta then.
      additionalProperties: true
    CarbonTrendPoint:
