# Kept in sync with the registered routes by internal/app TestOpenAPIMatchesRoutes.
openapi: 3.0.3
info:
  title: Reliabilix GreenOps API
  version: 0.30.0
  description: Multi-tenant FinOps + GreenOps API. Tenancy comes from the verified identity (membership in the database) or from an API key, never
    from request input. Every tenant table is protected by Row Level Security.
servers:
- url: https://api.reliabilix.green
security:
- bearerAuth: []
tags:
- name: system
  description: Health endpoints
- name: automation
  description: Reviewed change plans for approved recommendations (never executed by the platform)
- name: tenants
  description: Onboarding, members, invitations, API keys, audit log
- name: users
  description: Current identity
- name: projects
  description: Projects, SCI functional units and policies
- name: cloud
  description: Cloud connections and sync
- name: usage
  description: FOCUS usage records
- name: carbon
  description: Carbon calculation, summary, SCI and methodology
- name: ci
  description: CI gate for pipelines
- name: finops
  description: Cost summary, budgets, anomalies
- name: dashboard
  description: Read models of the Overview screen
- name: recommendations
  description: Recommendations and the human-approval workflow
- name: reports
  description: Report generation and download
- name: settings
  description: Configuration of the organization (ADR-0023)
- name: operator
  description: Platform operator console (cross-tenant metadata for the people who run the platform)
- name: notifications
  description: Where events are delivered (e-mail, webhook, Slack); destinations, delivery history, available channels
paths:
  /version:
    get:
      operationId: getVersion
      summary: Build identity of this service
      tags:
      - system
      description: |
        Platform release, stage (dev, alpha, beta, rc, stable), service name and short commit of the running process.
        Versioning policy: docs/release/versioning.md.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [platform, stage, service, commit]
                properties:
                  platform: {type: string, example: 0.1.0-alpha.1}
                  stage: {type: string, enum: [dev, alpha, beta, rc, stable]}
                  service: {type: string, example: api}
                  commit: {type: string}
  /healthz:
    get:
      operationId: healthz
      summary: Liveness
      tags:
      - system
      responses:
        '200':
          description: alive
      security: []
  /readyz:
    get:
      operationId: readyz
      summary: Readiness (database reachable)
      tags:
      - system
      responses:
        '200':
          description: ready
        '503':
          $ref: '#/components/responses/Problem'
      security: []
  /api/v1/onboarding:
    post:
      operationId: onboard
      summary: Create the caller's organization (idempotent)
      tags:
      - tenants
      description: Requires permission `valid identity (no tenant needed)`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantRef'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation (verified email must match)
      tags:
      - tenants
      description: Requires permission `valid identity (no tenant needed)`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationInput'
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantRef'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/me:
    get:
      operationId: getMe
      summary: Current identity
      tags:
      - users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/tenant:
    get:
      operationId: getTenant
      summary: Current organization
      tags:
      - tenants
      description: Requires permission `project:read`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: renameTenant
      summary: Rename the organization
      tags:
      - tenants
      description: Requires permission `tenant:admin`. The change is audited (`organization.renamed`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 2, maxLength: 100}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/tenant/export:
    get:
      operationId: exportOrganizationData
      summary: Download all of the organization's data (NDJSON stream)
      tags:
      - tenant
      description: |
        Requires permission `tenant:data` (owners, people only). One JSON object per line, `{"table": ..., "row": {...}}`,
        from a single consistent snapshot; the first line describes the export. Secrets (API key hashes, invitation
        tokens, notification targets, AWS ExternalIds) and generated report files are not included.
      responses:
        '200':
          description: OK
          content:
            application/x-ndjson:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/tenant/deletion:
    get:
      operationId: getOrganizationDeletion
      summary: Whether the erasure of the organization is scheduled
      tags:
      - tenant
      description: Requires permission `tenant:data`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deletion'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: scheduleOrganizationDeletion
      summary: Schedule the erasure of the organization after a grace period
      tags:
      - tenant
      description: |
        Requires permission `tenant:data` and a person (not an API key). The exact organization name must be typed.
        Nothing is removed now: everything is erased when the grace period (setting `lifecycle.deletion_grace_days`)
        is over, unless the request is cancelled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - confirm_name
              properties:
                confirm_name:
                  type: string
      responses:
        '202':
          description: Scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deletion'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: cancelOrganizationDeletion
      summary: Cancel a scheduled erasure
      tags:
      - tenant
      description: Requires permission `tenant:data` and a person.
      responses:
        '204':
          description: Cancelled
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/alerts:
    get:
      operationId: listAlerts
      summary: Alerts of the organization (budgets and connections)
      tags:
      - alerts
      description: |
        Requires permission `project:read`. Alerts are opened and resolved by an hourly evaluation; people can
        acknowledge or mute them. Most urgent first, resolved ones last.
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - new
          - acknowledged
          - muted
          - resolved
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alert'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/alerts/{id}/acknowledge:
    post:
      operationId: acknowledgeAlert
      summary: Acknowledge an alert
      tags:
      - alerts
      description: Requires permission `alert:write` and a person (not an API key).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/alerts/{id}/mute:
    post:
      operationId: muteAlert
      summary: Mute an alert (it still resolves by itself)
      tags:
      - alerts
      description: Requires permission `alert:write` and a person (not an API key).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/alerts/{id}/unmute:
    post:
      operationId: unmuteAlert
      summary: Return a muted alert to new
      tags:
      - alerts
      description: Requires permission `alert:write` and a person (not an API key).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/kubernetes/energy:
    post:
      operationId: ingestKubernetesEnergy
      summary: Push measured workload energy (Kubernetes agent)
      tags:
      - kubernetes
      description: |
        Requires permission `kubernetes:ingest` (an API key of role `agent`, or an owner). Up to 500 samples of one
        UTC hour each; the whole batch is refused when one sample is invalid. Sending an hour again replaces it.
        Energy is attribution inside the nodes' energy and is not added to the organization's totals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KubernetesEnergyInput'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer
                  without_grid_data:
                    type: integer
                  methodology_version:
                    type: string
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/kubernetes/workloads:
    get:
      operationId: listKubernetesWorkloads
      summary: Energy and carbon per workload
      tags:
      - kubernetes
      description: Requires permission `carbon:read`. `carbon_kg_co2e` is null when some hours had no grid data.
      parameters:
      - $ref: '#/components/parameters/from'
      - $ref: '#/components/parameters/to'
      - $ref: '#/components/parameters/project_id'
      - name: cluster
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/KubernetesWorkload'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/kubernetes/clusters:
    get:
      operationId: listKubernetesClusters
      summary: Energy and carbon per cluster
      tags:
      - kubernetes
      description: Requires permission `carbon:read`.
      parameters:
      - $ref: '#/components/parameters/from'
      - $ref: '#/components/parameters/to'
      - $ref: '#/components/parameters/project_id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/KubernetesCluster'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/members:
    get:
      operationId: listMembers
      summary: List members
      tags:
      - tenants
      description: Requires permission `tenant:admin`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/roles:
    get:
      operationId: listRoles
      summary: Permission catalog, built-in roles and the organization's custom roles
      tags:
      - tenants
      description: Requires permission `tenant:admin`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [permissions, builtin, custom]
                properties:
                  permissions:
                    type: array
                    items:
                      type: object
                      required: [key, group, assignable]
                      properties:
                        key: {type: string}
                        group: {type: string}
                        assignable: {type: boolean}
                  builtin:
                    type: array
                    items:
                      type: object
                      required: [role, permissions]
                      properties:
                        role: {type: string}
                        permissions: {type: array, items: {type: string}}
                  custom:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomRole'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createRole
      summary: Create a custom role
      tags:
      - tenants
      description: |
        Requires permission `tenant:admin`. A custom role cannot contain administration, data export or machine-only
        permissions, and only permissions the caller holds (422 / 403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomRoleInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRole'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/roles/{id}:
    put:
      operationId: updateRole
      summary: Change a custom role
      tags:
      - tenants
      description: Requires permission `tenant:admin` and holding every permission of the role, old and new.
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomRoleInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRole'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteRole
      summary: Delete a custom role (its members return to their built-in role)
      tags:
      - tenants
      description: Requires permission `tenant:admin`.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/members/{id}:
    patch:
      operationId: changeMemberRole
      summary: Change a member's role (last owner is protected)
      tags:
      - tenants
      description: Requires permission `tenant:admin`.
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeMember
      summary: Remove a member
      tags:
      - tenants
      description: Requires permission `tenant:admin`.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/invitations:
    get:
      operationId: listInvitations
      summary: List invitations
      tags:
      - tenants
      description: Requires permission `tenant:admin`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createInvitation
      summary: Invite a person (the one-time token is returned once)
      tags:
      - tenants
      description: Requires permission `tenant:admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreated'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys (never returns key material)
      tags:
      - tenants
      description: Requires permission `tenant:admin`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createApiKey
      summary: Create an API key (shown once)
      tags:
      - tenants
      description: Requires permission `tenant:admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key
      tags:
      - tenants
      description: Requires permission `tenant:admin`.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/audit-log:
    get:
      operationId: listAuditLog
      summary: Audit trail (append-only)
      tags:
      - tenants
      description: Requires permission `audit:read`.
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: action
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects
      tags:
      - projects
      description: Requires permission `project:read`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createProject
      summary: Create a project
      tags:
      - projects
      description: Requires permission `project:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/projects/{id}:
    get:
      operationId: getProject
      summary: Get a project
      tags:
      - projects
      description: Requires permission `project:read`.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteProject
