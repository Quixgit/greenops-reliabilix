          $ref: '#/components/responses/Problem'
    post:
      operationId: createNotificationDestination
      summary: Add a destination
      tags:
      - notifications
      description: |
        Requires permission `notification:write`. The address is sealed with AES-256-GCM before it is stored.
        `email` addresses must belong to a member of the organization. `webhook` and `slack` URLs must be public
        https endpoints (Slack: an incoming-webhook URL on hooks.slack.com). For `webhook` the response carries a
        `signing_secret` once; deliveries are signed with it (`X-Reliabilix-Signature: t=<unix>,v1=<hex HMAC-SHA256
        of "<t>.<body>">`). At most 20 destinations per organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationDestination'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedNotificationDestination'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
