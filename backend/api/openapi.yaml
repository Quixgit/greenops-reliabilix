      summary: Start a payment for a plan at a payment provider
      tags:
      - licensing
      description: |
        Requires permission `billing:read` (owner, admin, billing). Answers a `url` to send the person to, or a `message` for
        providers without a hosted page (invoice), with the `plan` and the `intent` (renew, upgrade, downgrade). Choosing the
        current plan renews it. The plan id travels to the provider, so its confirmation names the plan that was paid for;
        the plan becomes active when the provider confirms the payment by webhook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, plan]
              properties:
                provider: {type: string, enum: [stripe, paddle, liqpay, wayforpay, invoice]}
                plan: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
