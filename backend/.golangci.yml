version: "2"
linters:
  enable: [gosec, errcheck, govet, staticcheck, depguard, bodyclose, noctx, rowserrcheck]
  exclusions:
    paths: ["internal/.*/repository/db"]   # sqlc-generated
    rules:
      - path: _test\.go
        text: "G101"   # IAM role ARNs in test fixtures are references, not credentials
  settings:
    depguard:
      rules:
        # domain/ is pure: no transport, persistence, queue or SDK imports.
        domain-purity:
          files: ["**/internal/*/domain/**", "!**/*_test.go"]
          deny:
            - {pkg: net/http, desc: "domain must not depend on transport"}
            - {pkg: github.com/go-chi, desc: "domain must not depend on transport"}
            - {pkg: github.com/jackc/pgx, desc: "domain must not depend on persistence"}
            - {pkg: database/sql, desc: "domain must not depend on persistence"}
            - {pkg: github.com/hibiken/asynq, desc: "domain must not depend on the queue"}
            - {pkg: github.com/aws, desc: "domain must not depend on cloud SDKs"}
        # tenants reaches other domains only through ports wired in internal/app, never their internals.
        isolate-tenants:
          files: ["**/internal/tenants/**", "!**/*_test.go"]
          deny:
            - {pkg: github.com/quixgit/greenops-reliabilix/backend/internal/users, desc: "domains must not import each other: declare a port and wire it in internal/app"}
            - {pkg: github.com/quixgit/greenops-reliabilix/backend/internal/projects, desc: "domains must not import each other: declare a port and wire it in internal/app"}
            - {pkg: github.com/quixgit/greenops-reliabilix/backend/internal/cloudaccounts, desc: "domains must not import each other: declare a port and wire it in internal/app"}
            - {pkg: github.com/quixgit/greenops-reliabilix/backend/internal/ingestion, desc: "domains must not import each other: declare a port and wire it in internal/app"}
            - {pkg: github.com/quixgit/greenops-reliabilix/backend/internal/usage, desc: "domains must not import each other: declare a port and wire it in internal/app"}
            - {pkg: github.com/quixgit/greenops-reliabilix/backend/internal/carbon, desc: "domains must not import each other: declare a port and wire it in internal/app"}
            - {pkg: github.com/quixgit/greenops-reliabilix/backend/internal/finops, desc: "domains must not import each other: declare a port and wire it in internal/app"}
            - {pkg: github.com/quixgit/greenops-reliabilix/backend/internal/recommendations, desc: "domains must not import each other: declare a port and wire it in internal/app"}
            - {pkg: github.com/quixgit/greenops-reliabilix/backend/internal/kubernetes, desc: "domains must not import each other: declare a port and wire it in internal/app"}
            - {pkg: github.com/quixgit/greenops-reliabilix/backend/internal/reports, desc: "domains must not import each other: declare a port and wire it in internal/app"}
            - {pkg: github.com/quixgit/greenops-reliabilix/backend/internal/automation, desc: "domains must not import each other: declare a port and wire it in internal/app"}
            - {pkg: github.com/quixgit/greenops-reliabilix/backend/internal/dashboard, desc: "domains must not import each other: declare a port and wire it in internal/app"}
        # users reaches other domains only through ports wired in internal/app, never their internals.
        isolate-users:
