version: "2"
linters:
  enable: [gosec, errcheck, govet, staticcheck, depguard, bodyclose, noctx, rowserrcheck]
  settings:
    depguard:
      rules:
        # domain/ is pure: no transport, persistence, queue or SDK imports.
        domain-purity:
          files: ["**/internal/*/domain/**", "!**/*_test.go"]
          deny:
            - {pkg: net/http, desc: "domain must not depend on transport"}
            - {pkg: github.com/go-chi, desc: "domain must not depend on transport"}
            - {pkg: github.com/jackc/pgx, desc: "domain must not depend on persistence"}
            - {pkg: database/sql, desc: "domain must not depend on persistence"}
            - {pkg: github.com/hibiken/asynq, desc: "domain must not depend on the queue"}
            - {pkg: github.com/aws, desc: "domain must not depend on cloud SDKs"}
        # tenants may use other domains only through their package root (service.go), never their internals.
        isolate-tenants:
          files: ["**/internal/tenants/**"]
          deny:
            - {pkg: github.com/quixgit/greenops-reliabilix/backend/internal/users/domain, desc: "use the users module API, not its internals"}
            - {pkg: github.com/quixgit/greenops-reliabilix/backend/internal/users/application, desc: "use the users module API, not its internals"}
            - {pkg: github.com/quixgit/greenops-reliabilix/backend/internal/users/repository, desc: "use the users module API, not its internals"}
            - {pkg: github.com/quixgit/greenops-reliabilix/backend/internal/users/http, desc: "use the users module API, not its internals"}
            - {pkg: github.com/quixgit/greenops-reliabilix/backend/internal/users/providers, desc: "use the users module API, not its internals"}
