version: "2"
linters:
  enable: [gosec, errcheck, govet, staticcheck, depguard, bodyclose, noctx, sqlclosecheck, rowserrcheck]
  settings:
    depguard:
      rules:
        domain-purity:
          files: ["**/internal/domain/**"]
          deny:
            - {pkg: "net/http", desc: "domain must not depend on transport"}
            - {pkg: "database/sql", desc: "domain must not depend on persistence"}
            - {pkg: "github.com/aws", desc: "domain must not depend on cloud SDKs"}
