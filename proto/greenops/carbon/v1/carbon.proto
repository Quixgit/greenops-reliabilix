syntax = "proto3";

package greenops.carbon.v1;

option go_package = "github.com/quixgit/greenops-reliabilix/gen/greenops/carbon/v1;carbonv1";

// Internal gRPC contract of the carbon service. tenant_id comes from the
// verified token in call metadata, never from the message body.
service CarbonService {
  rpc Calculate(CalculateRequest) returns (CalculateResponse);
}

message CalculateRequest {
  string usage_kind = 1;
  double amount = 2;
  double grid_intensity_g_per_kwh = 3;
}

message CalculateResponse {
  double energy_kwh = 1;
  double co2e_kg = 2;
  string methodology_version = 3;
}
