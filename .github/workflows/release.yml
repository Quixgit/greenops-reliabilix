# Builds and publishes the six images of a release (docs/release/versioning.md section 6, step 3).
# Triggered only by a version tag. Never publishes `latest`.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          [ "$tag" = "$file" ] || { echo "tag $tag does not match VERSION $file"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with: {go-version-file: backend/go.mod}
      - name: manifest and unit tests
        working-directory: backend
        run: go test ./...
  images:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: api,       file: deploy/docker/Dockerfile,     args: "CMD=api"}
          - {name: worker,    file: deploy/docker/Dockerfile,     args: "CMD=worker"}
          - {name: scheduler, file: deploy/docker/Dockerfile,     args: "CMD=scheduler"}
          - {name: migrate,   file: deploy/docker/Dockerfile,     target: migrate}
          - {name: web,       file: deploy/docker/Dockerfile.web}
          - {name: agent,     file: deploy/docker/Dockerfile.agent}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - id: meta
        run: |
          repo="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr A-Z a-z)/reliabilix/${{ matrix.name }}"
          v="${{ needs.check.outputs.version }}"
          sha="$(echo "$GITHUB_SHA" | cut -c1-7)"
          echo "tags=$repo:$v,$repo:$v-$sha" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ${{ matrix.args }}
            VERSION=${{ needs.check.outputs.version }}
            NEXT_PUBLIC_BUILD_VERSION=${{ needs.check.outputs.version }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
